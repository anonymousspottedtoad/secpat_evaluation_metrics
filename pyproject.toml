[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secpat-scoring"
version = "0.23.0"
description = "Pattern drift scoring (Levels 1-3) for security-pattern recovery."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Anonymous" }]

# One parser for every consumer. `tree-sitter` is pinned exactly rather than
# floated: grammar packages are built against a language ABI, and a mismatch
# fails by parsing every file to zero symbols rather than by raising, which
# reads downstream as recovery drift instead of as a broken install.
dependencies = [
    # The interaction-order detector Level 3 compares the output of. Pinned by
    # name: a consumer installing this from git lists its git URL as well.
    "secpat-interaction-order==0.1.0",
    "tree-sitter==0.26.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-go>=0.25.0",
]
# No `jedi`: the Python-only backend it powered is gone. The graph Level 3 walks
# comes from the Joern query service over HTTP (stdlib `urllib`), so nothing here
# resolves symbols in-process any more. The grammars stay — they build the struct
# index Level 2 reads.

[project.optional-dependencies]
dev = ["pytest", "ruff>=0.4"]

[project.urls]
Repository = "https://github.com/anonymousspottedtoad/secpat_evaluation_metrics"

[tool.hatch.build.targets.wheel]
packages = ["src/secpat_scoring"]

[tool.hatch.build.targets.sdist]
include = ["src/secpat_scoring", "tests", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# 120: this code was written wide, and reflowing it would bury real changes in
# cosmetic churn. Narrow it later if desired.
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
